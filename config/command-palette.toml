# コマンドパレットの文言。画面の文字でこのファイルを検索して直す。
# 開発中はパレットを開き直すと読み直す。
#
# ids     同じ文言を使う command ID。効果や対象が違う操作は別の項目にする
# screen  その画面だけの文言。無い欄は screen の無い項目の値を使う
# name    機能名。track.entry と recent.entry は実データの名前を出すので、書いても効かない
# tooltip 説明。改行は \n
# search  名前と同格の検索語。空白で区切る

