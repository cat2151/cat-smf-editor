# Generic Rust + sibling UAPMD release engine. No application/repository names here.
# Can be moved unchanged to a shared repository; checkout always uses the caller.
name: UAPMD Windows release
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: .github/release.json
      publish:
        type: boolean
        default: false
      skip-unchanged:
        type: boolean
        default: false
permissions:
  contents: read
# Serialize the whole pipeline so release replacement operations cannot overlap.
concurrency:
  group: uapmd-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      package: ${{ steps.resolve.outputs.package }}
      version: ${{ steps.resolve.outputs.version }}
      dependencies: ${{ steps.resolve.outputs.dependencies }}
      build-script: ${{ steps.resolve.outputs.build-script }}
      package-files: ${{ steps.resolve.outputs.package-files }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve dependencies and write notes
        id: resolve
        env:
          CONFIG: ${{ inputs.config }}
          SKIP_UNCHANGED: ${{ inputs.skip-unchanged }}
          # Bump when changing the shared engine, including after centralization.
          ENGINE_REVISION: '3'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, os, pathlib, re, string, subprocess, tomllib
          config = json.loads(pathlib.Path(os.environ['CONFIG']).read_text(encoding='utf-8'))
          package = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['package']
          name, version = package['name'], package['version']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+', name + version):
              raise ValueError('Invalid package name/version')
          dependencies = config['dependencies']
          paths = {'app'}
          for dep in dependencies:
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', dep['repository']):
                  raise ValueError('Invalid dependency repository')
              if not re.fullmatch(r'[A-Za-z0-9_-]+', dep['path']) or dep['path'] in paths:
                  raise ValueError('Dependency paths must be unique sibling directory names')
              paths.add(dep['path'])
              output = subprocess.check_output(
                  ['git', 'ls-remote', '--exit-code', 'https://github.com/' + dep['repository'], dep['ref']],
                  text=True).splitlines()
              if len(output) != 1:
                  raise ValueError('Dependency ref must resolve to exactly one commit')
              dep['sha'] = output[0].split()[0]
              if not re.fullmatch(r'[0-9a-f]{40}', dep['sha']):
                  raise ValueError('Invalid dependency commit')
          marker = '<!-- build-inputs ' + json.dumps(
              {'app': os.environ['GITHUB_SHA'], 'engine': os.environ['ENGINE_REVISION'],
               'dependencies': dependencies}, sort_keys=True) + ' -->'
          tag = 'v' + version
          release = subprocess.run(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/releases/tags/' + tag],
                                   capture_output=True, text=True)
          if release.returncode and 'HTTP 404' not in release.stderr:
              raise RuntimeError(release.stderr)
          body = (json.loads(release.stdout).get('body') or '') if release.returncode == 0 else ''
          unchanged = marker in body.splitlines()
          build = not (os.environ['SKIP_UNCHANGED'] == 'true' and unchanged)
          commits = [f'- {name}: {os.environ["GITHUB_SHA"]}']
          order = config.get('notes_dependency_order', [dep['path'] for dep in dependencies])
          if len(order) != len(dependencies) or set(order) != {dep['path'] for dep in dependencies}:
              raise ValueError('Notes dependency order must contain every dependency exactly once')
          for dep in sorted(dependencies, key=lambda dep: order.index(dep['path'])):
              label = dep['repository'].split('/')[-1]
              if dep.get('verified_sha'):
                  label += f'（{dep["repository"]} の {dep["ref"].removeprefix("refs/heads/")}）'
              commits.append(f'- {label}: {dep["sha"]}')
              if dep.get('verified_sha'):
                  match = '一致' if dep['sha'] == dep['verified_sha'] else f'不一致（手元で動作を確認していない {dep["repository"].split("/")[-1]} の版でビルドした）'
                  commits.append(f'  - 手元で確認した {dep["repository"].split("/")[-1]} {dep["verified_sha"]} と{match}')
          template = string.Template(pathlib.Path('.github/release-notes.md').read_text(encoding='utf-8'))
          notes = template.substitute(name=name, version=version,
              package_files='、'.join(pathlib.Path(file).name for file in config['package_files']),
              commits='\n'.join(commits), build_inputs=marker)
          pathlib.Path('notes.md').write_text(notes, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              values = {'build': str(build).lower(), 'package': name, 'version': version,
                        'dependencies': json.dumps(dependencies), 'build-script': config['build_script'],
                        'package-files': json.dumps(config['package_files'])}
              for key, value in values.items():
                  if '\n' in value or '\r' in value:
                      raise ValueError('Output values must be single-line')
                  out.write(f'{key}={value}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f'Build: {build} (published inputs unchanged: {unchanged})\n\n' + notes)
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: windows-latest
    env:
      DEPENDENCIES: ${{ needs.resolve.outputs.dependencies }}
      BUILD_SCRIPT: ${{ needs.resolve.outputs.build-script }}
      PACKAGE_FILES: ${{ needs.resolve.outputs.package-files }}
      PACKAGE: ${{ needs.resolve.outputs.package }}
      VERSION: ${{ needs.resolve.outputs.version }}
      # The shared build driver also applies /MT to the C++ host and SMF bridge.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - run: git config --global core.longpaths true
        id: longpaths
      - uses: actions/checkout@v7
        id: checkout
        with:
          path: app
          persist-credentials: false
      - name: Checkout resolved sibling commits
        id: siblings
        shell: python
        run: |
          import json, os, subprocess
          for dep in json.loads(os.environ['DEPENDENCIES']):
              def git(*args):
                  subprocess.run(['git', *args], check=True)
              git('init', dep['path'])
              git('-C', dep['path'], 'remote', 'add', 'origin', 'https://github.com/' + dep['repository'])
              git('-C', dep['path'], 'fetch', '--depth=1', 'origin', dep['sha'])
              git('-C', dep['path'], 'checkout', '--detach', 'FETCH_HEAD')
      - name: Update Rust and show tool versions
        id: tools
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc -vV
          cargo -V
          cmake --version
      - name: Project build and checks
        id: project
        working-directory: app
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/release-diagnostics
        run: |
          New-Item -ItemType Directory -Force $env:DIAGNOSTICS_DIR | Out-Null
          $log = Join-Path $env:DIAGNOSTICS_DIR 'build.log'
          try {
            & (Join-Path (Get-Location) $env:BUILD_SCRIPT) *>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
          } catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append
            throw
          }
          if ($code) { exit $code }
      - name: Test
        id: test
        working-directory: app
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/release-diagnostics
          RUST_BACKTRACE: '1'
        run: |
          New-Item -ItemType Directory -Force $env:DIAGNOSTICS_DIR | Out-Null
          cargo test --release --locked *>&1 | Tee-Object -FilePath (Join-Path $env:DIAGNOSTICS_DIR 'test.log')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package
        id: package
        working-directory: app
        shell: python
        run: |
          import json, os, pathlib, zipfile
          files = [f'target/release/{os.environ["PACKAGE"]}.exe'] + json.loads(os.environ['PACKAGE_FILES'])
          if len({pathlib.Path(file).name.casefold() for file in files}) != len(files):
              raise ValueError('Duplicate ZIP filename')
          pathlib.Path('dist').mkdir(exist_ok=True)
          archive = f'dist/{os.environ["PACKAGE"]}-{os.environ["VERSION"]}-windows-x64.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as out:
              for file in files:
                  path = pathlib.Path(file)
                  if path.is_absolute() or '..' in path.parts or not path.is_file():
                      raise ValueError('Invalid/missing package file: ' + file)
                  out.write(path, path.name)
      - uses: actions/upload-artifact@v7
        id: archive
        with:
          name: windows-x64
          path: app/dist/*.zip
          if-no-files-found: error
      - name: Write build diagnostics
        if: always()
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/release-diagnostics
          STEP_RESULTS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import html, json, os, pathlib, re, shutil, subprocess
          root = pathlib.Path(os.environ['DIAGNOSTICS_DIR'])
          root.mkdir(parents=True, exist_ok=True)
          steps = json.loads(os.environ['STEP_RESULTS'])
          metadata = {key: os.environ.get(key, '') for key in
                      ['RUN_URL', 'GITHUB_SHA', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH',
                       'ImageOS', 'ImageVersion', 'PACKAGE', 'VERSION', 'BUILD_SCRIPT']}
          metadata['steps'] = steps
          metadata['dependencies'] = json.loads(os.environ['DEPENDENCIES'])
          for dep in metadata['dependencies']:
              result = subprocess.run(['git', '-C', dep['path'], 'rev-parse', 'HEAD'],
                                      capture_output=True, text=True)
              dep['checked_out_sha'] = result.stdout.strip() if result.returncode == 0 else None
          (root / 'context.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          for name in ['CMakeCache.txt', 'CMakeFiles/CMakeConfigureLog.yaml']:
              source = pathlib.Path('app/target/shim') / name
              if source.is_file():
                  shutil.copyfile(source, root / source.name)
          lines = ['## Release build diagnostics', '', os.environ['RUN_URL'],
                   '', 'App SHA: `' + os.environ['GITHUB_SHA'] + '`', '', '| Step | Outcome |', '| --- | --- |']
          for name, result in steps.items():
              lines.append(f'| {name} | {result["outcome"]} |')
              if result['outcome'] == 'failure':
                  print(f'::error title=Release step failed::{name}: see release-diagnostics artifact and job log.')
          lines += ['', 'Full logs, dependency SHAs and CMake diagnostics: `release-diagnostics` artifact.',
                    'Earlier checkout/tool failures: open the failed step in the job log.', '']
          for name in ['build', 'test']:
              path = root / (name + '.log')
              if not path.is_file():
                  continue
              log = path.read_text(encoding='utf-8-sig', errors='replace').splitlines()
              # Include the message after a panic, not only the assertion location.
              hits = [i for i, line in enumerate(log) if re.search(
                  r'(?i)(^\s*(?:error[\[:]|fatal:|CMake Error|FAILED:|failures:|test result: FAILED|---- .* stdout ----)|panicked at|^Exception:)', line)]
              selected = sorted({j for i in hits for j in range(max(0, i - 1), min(len(log), i + 7))})
              excerpt = [log[i] for i in selected][:160]
              if not excerpt and steps.get('project' if name == 'build' else 'test', {}).get('outcome') == 'failure':
                  excerpt = log[-80:]
              if excerpt:
                  lines += ['### ' + name + ' log excerpt', '', '<pre>',
                            html.escape('\n'.join(excerpt)[:24000]), '</pre>', '']
          report = '\n'.join(lines)
          (root / 'summary.md').write_text(report, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(report)
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics
          path: ${{ runner.temp }}/release-diagnostics/
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [resolve, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist
      - name: Replace release after successful checks
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > /dev/null 2> error.txt; then
            gh release delete "$TAG" --cleanup-tag --yes
          elif ! grep -q 'HTTP 404' error.txt; then
            cat error.txt >&2; exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2> error.txt; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          elif ! grep -q 'HTTP 404' error.txt; then
            cat error.txt >&2; exit 1
          fi
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/notes.md
  report:
    needs: [resolve, build, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Release result
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json, os
          jobs = json.loads(os.environ['JOB_RESULTS'])
          lines = ['## Release result', '', os.environ['RUN_URL'], '',
                   'App SHA: `' + os.environ['GITHUB_SHA'] + '`', '',
                   '| Job | Result |', '| --- | --- |']
          for name, job in jobs.items():
              lines.append(f'| {name} | {job["result"]} |')
              if job['result'] == 'failure':
                  print(f'::error title=Release {name} failed::Open the {name} job log. '
                        'For build/test failures, see the build summary and release-diagnostics artifact.')
          build = jobs['resolve'].get('outputs', {}).get('build')
          if build == 'false':
              lines += ['', 'Build skipped: published inputs are unchanged.']
          elif jobs['build']['result'] == 'failure':
              lines += ['', 'Build/check/test/package pipeline failed; publication was skipped.',
                        'See build summary and release-diagnostics artifact for step outcomes and error excerpts.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
