[package]
name = "cat-smf-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
quick-xml = "0.41"
mascot-render-client = { path = "../mascot-render-server/crates/mascot-render-client" }
mascot-render-protocol = { path = "../mascot-render-server/crates/mascot-render-protocol" }
mmlabc-to-smf = { git = "https://github.com/cat2151/mmlabc-to-smf-rust.git", package = "mmlabc-to-smf", features = ["cli"] }
cmrt-chord = { path = "../clap-mml-render-tui/chord" }
eframe = "0.31"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
regex = "1"
fastrand = "2"
rustmigemo = { git = "https://github.com/oguna/rustmigemo.git", rev = "121101dfcfd9465c998ba53fabe43773b14bf868" }


libloading = "0.8"
# Plugin path comparison only (shared/chain_settings.rs); the host stack stays off.
cmrt-core = { path = "../clap-mml-play-server/core-lib", default-features = false }
dirs = "6"
dunce = "1.0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
ureq = "3"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = []
recording-mode = []
