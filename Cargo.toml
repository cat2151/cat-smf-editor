[package]
name = "cat-smf-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"


libloading = "0.8"
# Plugin path comparison only (shared/chain_settings.rs); the host stack stays off.
cmrt-core = { path = "../clap-mml-play-server/core-lib", default-features = false }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
ureq = "3"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = []
recording-mode = []
